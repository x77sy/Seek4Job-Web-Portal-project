<!DOCTYPE html>

<head>

<body class="forgetpassword-body">
  <h1 class="forgetpassword-h1">Reset your password</h1>
  <p class="forgetpassword-p">
    If the account exists, we will email you instructions to reset the password.
  </p>

  <form id="forgetForm" class="signin_signup-form">
      <input type="email" id="email" name="email" placeholder="Enter your email address" required>
      <button type="submit" class="send-btn">Send</button>
      <p class="signin-p">Return to
          <a href="index.html" class="signin-link">Sign In</a>
      </p>
  </form>

  <script src="JS/main.js"></script>
</body>
</html>
