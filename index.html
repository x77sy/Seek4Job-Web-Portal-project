<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seek4Job</title>
  <link rel="stylesheet" href="CSS/employer_style.css">
</head>

<body class="nav-body">

  <!-- Top navigation bar -->
  <nav class="top-nav">
    <img src="images/logo.png" class="logo-img">

    <ul class="center-menu">
      <li><a href="employer_aboutus.html">About Us</a></li>
      <li><a href="employer_dashboard.html">Dashboard</a></li>
      <li><a class="active" href="#">Profile</a></li>
    </ul>

        <button class="name-btn" id="nameBtn">Name</button>
  </nav>

  <div class="dashboard-container">

    <div class="content-area">

      <!-- Job Seeker profile header -->
    <div class="main-content dashboard-container">
      <div class="company-header">
          <div>
          <h2 class="company-title">Seek4Job</h2>

          <p id="companySummary" class="company-summary">
            Technology | 51–200 employees
          </p>
        </div>

        <!-- Logo and buttons -->
        <div class="logo-container">

          <!-- Logo circle -->
          <div id="companyLogo" class="company-logo">Logo</div>

          <!-- Buttons -->
          <div class="logo-buttons">

            <label for="logoUpload" class="change-logo">
              Change Logo
            </label>
            <input type="file" id="logoUpload" accept="image/*" style="display:none;">

            <button onclick="removeLogo()" class="remove-logo">Remove Logo</button>

          </div>

        </div>

      </div>

      <!-- Tabs -->
      <div class="inbox-tabs">
        <button class="tab-btn active" onclick="openTab(event, 'companyTab')">Company Details</button>
        <button class="tab-btn" onclick="openTab(event, 'settingsTab')">Account Settings</button>
      </div>


      <!-- Company tab -->
      <div id="companyTab" class="active-tab tab-content">

        <div class="form-container">

          <h3 class="box-title">Company Details</h3>

          <div class="form-group">
            <label>Company Name</label>
            <input id="companyName" type="text" placeholder="Enter company name">
          </div>

          <div class="form-group">
            <label>Industry / Sector</label>
            <select id="companyIndustry">
              <option>Technology</option>
              <option>Education</option>
              <option>Healthcare</option>
              <option>Finance</option>
              <option>Manufacturing</option>
              <option>Retail / E-commerce</option>
              <option>Marketing & Advertising</option>
              <option>Logistics</option>
              <option>Construction</option>
              <option>Other</option>
            </select>
          </div>

          <div class="form-group">
            <label>Company Size</label>
            <select id="companySize">
              <option>1–10 employees</option>
              <option>11–50 employees</option>
              <option>51–200 employees</option>
              <option>201–500 employees</option>
              <option>500+ employees</option>
            </select>
          </div>

          <div class="form-group">
            <label>Company Location / Headquarters</label>
            <input id="companyLocation" type="text" placeholder="e.g., Kuala Lumpur, Malaysia">
          </div>

          <div class="form-group">
            <label>Company Description</label>
            <textarea id="companyDescription" placeholder="Describe your company..."></textarea>
          </div>

          <div class="form-group">
            <label>Company Website</label>
            <input id="companyWebsite" type="text" placeholder="https://">
          </div>

          <button id="saveCompanyBtn" class="submit-btn">Save Company Details</button>
        </div>
      </div>

      <!-- Account setting tab -->
      <div id="settingsTab" class="tab-content">

        <div class="form-container">

          <h3 class="box-title">Account Settings</h3>

          <div class="form-group">
            <label>Account Email</label>
            <input id="accountEmail" type="email" placeholder="employer@company.com">
          </div>

          <div class="form-group">
            <label>Contact Phone Number</label>
            <input id="accountPhone" type="text" placeholder="Optional contact number">
          </div>

          <div class="form-group">
            <label style="margin-bottom:8px;">Notification Preferences</label>

            <div class="checkbox-row">
              <input type="checkbox" id="notifyApplicants">
              <label for="notifyApplicants">Email me when new applicants apply</label>
            </div>

            <div class="checkbox-row">
              <input type="checkbox" id="notifyMessages">
              <label for="notifyMessages">Email me when I receive a new message</label>
            </div>

            <div class="checkbox-row">
              <input type="checkbox" id="notifySystem">
              <label for="notifySystem">Send system updates & important alerts</label>
            </div>
          </div>

          <button class="submit-btn" id="saveSettingsBtn">Save Account Settings</button>

          <h4 class="password-title">Change Password</h4>

          <div class="form-group">
            <label>New Password</label>
            <input id="newPassword" type="password" placeholder="New password">
          </div>

          <div class="form-group">
            <label>Confirm Password</label>
            <input id="confirmPassword" type="password" placeholder="Confirm password">
          </div>

          <button class="submit-btn" id="savePasswordBtn">Update Password</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-center">
      <div class="footer-links">
        <a href="employer_helpcenter-contactus.html">Help Center & Contact Us</a>
        <a href="employer_feedback-reportissues.html">Feedback & Report Issue</a>
      </div>
      <p>&copy 2025 Seek4Job</p>
    </div>
    <a href="index.html" class="logout-btn">Logout</a>
  </footer>

  <script src="JS/main.js"></script>
  <script src="JS/employer_script.js"></script>

</body>
</html>
